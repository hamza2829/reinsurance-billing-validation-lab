name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Generate synthetic data
        run: python -m data.generate
      - name: Extract to staging (DuckDB)
        run: python -m extract.extract
      - name: Run validation
        run: python -m report.run
      - name: Generate rule docs
        run: python -m rules.docs
      - name: Tests with coverage
        run: pytest -q --cov --cov-report=term --cov-fail-under=90 | tail -n 20
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            report/out/
            extract/out/cleaning_log.csv
